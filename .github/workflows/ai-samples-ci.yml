name: AI samples CI

on:
  push:
    paths: ["ai-samples/**", ".github/workflows/ai-samples-ci.yml"]
  pull_request:
    paths: ["ai-samples/**", ".github/workflows/ai-samples-ci.yml"]
  schedule:
    - cron: "17 3 * * *"   # nightly: also runs the live-model eval when the secret is configured
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-eval:
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    defaults:
      run:
        working-directory: ai-samples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests + offline eval suites (golden dataset, RAG metrics). Fails the build if
      # any safety category drops below 100% or the overall pass rate drops below 95%.
      - name: Build, test and evaluate
        run: mvn -B -ntp verify

      - name: Publish eval summary
        if: always()
        run: |
          if [ -f evaluated-guardrail-agent/target/eval/eval-report.md ]; then
            cat evaluated-guardrail-agent/target/eval/eval-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f enterprise-rag-rbac/target/rag-eval/report.json ]; then
            echo -e "\n## RAG eval metrics\n\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat enterprise-rag-rbac/target/rag-eval/report.json >> "$GITHUB_STEP_SUMMARY"
            echo -e "\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Live-model safety eval (nightly, needs ANTHROPIC_API_KEY secret)
        if: github.event_name == 'schedule' && env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: mvn -B -ntp -pl evaluated-guardrail-agent -am test -Dtest=LiveClaudeEvalIT -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            ai-samples/evaluated-guardrail-agent/target/eval*/
            ai-samples/enterprise-rag-rbac/target/rag-eval/
          if-no-files-found: ignore
