spring:
  application:
    name: ehr-api

  # Default datasource targets an in-memory H2 database (same host/config as
  # content-retrieval-api). No external database and no datasource credentials are
  # required.
  datasource:
    url: jdbc:h2:mem:ehrdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: embedded
      data-locations: classpath:data.sql

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    com.ehrapi: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Local development profile backed by in-memory H2.
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:ehrdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
